# Linux build/test for this repo's backend. See Dockerfile.linux-ci for
# the underlying image stage, and backend/CLAUDE.md/build-test skill for
# the macOS-native equivalent of what this service's CMD runs.
#
# Usage:
#   docker compose build backend    # image only, no run
#   docker compose run --rm backend # build + ctest (le_shell/le_tcl included)
#
# The repo is bind-mounted read-write at /workspace, so build artifacts
# (backend/build-linux, backend/build_release-linux) land in the real
# working tree, same as a native build would - expect a `git status` to
# show them as untracked, same as today.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.linux-ci
      target: backend
    volumes:
      - .:/workspace
