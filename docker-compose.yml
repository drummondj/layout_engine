# Linux build/test for this repo. See Dockerfile.linux-ci for the
# underlying image stage, and CLAUDE.md/build-test skill for the native
# equivalent of what this service's CMD runs.
#
# Usage:
#   docker compose build ci    # image only, no run
#   docker compose run --rm ci # build + ctest (le_shell/le_tcl included)
#
# The repo is bind-mounted read-write at /workspace (codegen output lands
# in the real working tree, same as a native regen would), but the build
# trees live in the `ci-build` named volume at /build so they never collide
# with the host's own build/ and build_release/ CMake caches.
services:
  ci:
    build:
      context: .
      dockerfile: Dockerfile.linux-ci
      target: ci
    volumes:
      - .:/workspace
      - ci-build:/build

volumes:
  ci-build:
