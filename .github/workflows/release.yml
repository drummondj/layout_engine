name: Linux release build

# Builds a portable Linux x86_64 release against an old glibc baseline
# (Rocky Linux 8, glibc 2.28) so the result runs on newer distros too -
# glibc's own compatibility is one-directional (old-glibc binaries run
# fine on newer systems, not the reverse). See Dockerfile.linux-release's
# own header comment for the full rationale.
#
# Not a replacement for Dockerfile.linux-ci (the dev/PR CI path, untouched
# by this workflow) or scripts/rocky8-bootstrap.sh (for developing
# on a locked-down machine with no root/Docker) - this workflow assumes
# neither constraint, since GitHub-hosted runners have full root and full
# outbound network access.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A release tag must name the version CMakeLists.txt declares, so the
      # bundle's le_shell reports the same version as its download.
      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          project_version=$(sed -nE 's/^project\(layout_engine_backend VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [[ "${GITHUB_REF_NAME}" != "v${project_version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match the project version ${project_version} in CMakeLists.txt"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      # Exports the `export` stage's filesystem (just the app bundle - see
      # Dockerfile.linux-release's own final stage) directly to ./dist, no
      # docker create/cp needed. cache-from/to type=gha keeps the
      # expensive toolchain/oneTBB build stages cached between runs as
      # long as their own Dockerfile layers don't change.
      - name: Build release bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.linux-release
          target: export
          outputs: type=local,dest=./dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package release asset
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
          fi
          asset="layout_engine-linux-x86_64-${version}.tar.gz"
          tar czf "${asset}" -C dist .
          echo "ASSET_PATH=${asset}" >> "$GITHUB_ENV"

      # A detached SSH signature of the bundle, made with the release key
      # (the LE_RELEASE_SIGNING_KEY secret) and checked against the public
      # key committed in assets/keys/allowed_signers before anything is
      # published - see docs/RELEASING.md. Required for a tag; a manual run
      # without the secret just skips it.
      - name: Sign release asset
        env:
          SIGNING_KEY: ${{ secrets.LE_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY}" ]]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "::error::the LE_RELEASE_SIGNING_KEY secret is not set - see docs/RELEASING.md"
              exit 1
            fi
            echo "::warning::LE_RELEASE_SIGNING_KEY not set - the artifact is unsigned"
            exit 0
          fi
          key_file="${RUNNER_TEMP}/release_key"
          ( umask 077 && printf '%s\n' "${SIGNING_KEY}" > "${key_file}" )
          ssh-keygen -Y sign -f "${key_file}" -n layout_engine-release "${ASSET_PATH}"
          rm -f "${key_file}"
          ssh-keygen -Y verify -f assets/keys/allowed_signers -I release@layout-engine \
            -n layout_engine-release -s "${ASSET_PATH}.sig" < "${ASSET_PATH}"
          echo "SIGNATURE_PATH=${ASSET_PATH}.sig" >> "$GITHUB_ENV"

      # Only on an actual tag push - workflow_dispatch runs (used to
      # iterate on CI-only failures without creating throwaway
      # releases/tags, see BUILD.md/the plan this workflow came from) fall
      # through to the plain artifact upload below instead.
      - name: Create/update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.SIGNATURE_PATH }}
          body: |
            Portable Linux x86_64 build (glibc 2.28+, built against Rocky Linux 8).
            Includes le_shell, le_tcl.so, le_tcl_procs.tcl, and bundled fonts.

            The `.sig` file is an SSH signature of the tarball by the
            Layout Engine release key - see docs/RELEASING.md to verify it.

            **Runtime requirements**: a desktop Linux system with X11, Mesa
            GL/EGL, Tcl/Tk, and GNU readline installed - these can't be
            bundled into the release (dynamic linking throughout). Any
            reasonably current desktop distro already has them.

      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_PATH }}
          path: |
            ${{ env.ASSET_PATH }}
            ${{ env.SIGNATURE_PATH }}
