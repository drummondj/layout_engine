# Run with `dart run ffigen --config ffigen.yaml` (see .claude/skills/ffigen
# for the full regen procedure). backend/src/api/api.hpp is the only
# hand-edited source for lib/layout_engine_plugin_bindings_generated.dart -
# never hand-edit the generated output.
name: LayoutEnginePluginBindings
description: |
  Raw Dart FFI bindings for backend/src/api/api.hpp, the Layout Engine
  C API. Regenerate with `dart run ffigen --config ffigen.yaml` whenever
  api.hpp changes; never hand-edit this file's output directly.
output: 'lib/layout_engine_plugin_bindings_generated.dart'
# Force C parsing via a real `-x c` compiler-opt - api.hpp's .hpp extension
# otherwise makes libclang parse it as C++ regardless of the top-level
# `language:` key (that key only ever adds compiler-opts for `language:
# objc`, never for `c` - checked in ffigen 20.1.1's parser.dart). Under C++
# parsing, api.hpp's `extern "C" { ... }` guard becomes a LinkageSpecDecl,
# and ffigen's root-cursor walk only visits the translation unit's direct
# children - it never descends into that block, so every le_*()/LeHandle/
# LePixelBuffer declaration is silently dropped (confirmed by trial: only
# transitively-included <stdint.h> typedefs came out without this).
compiler-opts:
  - '-x'
  - 'c'
# api.hpp's own `#pragma once` triggers "#pragma once in main file" - a
# harmless clang warning that only fires because ffigen parses the header
# directly as a translation unit rather than via an #include chain (true of
# any header using the standard include-guard idiom as an entry point, not
# specific to this file). ffigen otherwise treats any compiler
# warning/error as fatal and refuses to emit bindings.
ignore-source-errors: true
headers:
  entry-points:
    - '../backend/src/api/api.hpp'
  # No include-directives: api.hpp only pulls in <stdint.h>, so there's
  # nothing else to filter out. (include-directives matches by glob against
  # the *resolved absolute* header path - a literal relative path here
  # silently matches nothing and produces an empty bindings file, which is
  # exactly what happened the first time this was tried.)
comments:
  style: any
  length: full
