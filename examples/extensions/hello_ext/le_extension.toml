# A minimal compiled extension: the in-tree example CI builds, so a change
# that breaks the extension SDK fails here before it reaches anyone else.
[extension]
name = "hello_ext"
version = "0.1.0"
prefix = "Hello"
description = "Example extension: counts libraries, adds a library as one undo step, and attaches notes (its own database class) to libraries"

[compatibility]
layout_engine = ">=0.3, <0.4"
extension_api = 1

[contents]
cmake = "le_extension.cmake"
schema = "schema_ext.py"
tcl_procs = ["tcl/hello_ext.tcl"]
tcl_tests = ["tests/hello_ext_test.tcl"]
resources = ["fonts/"]
